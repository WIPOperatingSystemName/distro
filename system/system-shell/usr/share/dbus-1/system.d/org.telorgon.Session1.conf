<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="org.telorgon.Session1"/>
    <deny send_destination="org.telorgon.Session1"/>
  </policy>
  <policy user="telorgon-shell">
    <allow send_destination="org.telorgon.Session1"/>
  </policy>
  <policy user="root">
    <allow own="org.telorgon.Session1"/>
    <allow send_destination="org.telorgon.Session1"/>
  </policy>
</busconfig>
