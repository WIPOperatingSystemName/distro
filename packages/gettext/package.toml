schema = 1

[package]
name = "gettext"
version = "1.0"
revision = 1
arch = "x86_64"
description = "GNU translation tools with genuine XML and desktop template merging"
license = "GPL-3.0-or-later AND LGPL-2.1-or-later AND MIT"
url = "https://www.gnu.org/software/gettext/"

[[sources]]
name = "main"
url = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz"
filename = "gettext-1.0.tar.xz"
sha256 = "71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7"

[dependencies]
native = []
target = ["glibc"]
runtime = ["glibc", "busybox"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
