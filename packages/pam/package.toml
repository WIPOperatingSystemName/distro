schema = 1

[package]
name = "pam"
version = "1.7.3"
revision = 1
arch = "x86_64"
description = "Linux Pluggable Authentication Modules with password and session APIs"
license = "BSD-3-Clause AND GPL-2.0-or-later"
url = "https://github.com/linux-pam/linux-pam/releases/download/v1.7.3/Linux-PAM-1.7.3.tar.xz"
backup = ["etc/pam.d/other"]

[[sources]]
name = "main"
url = "https://github.com/linux-pam/linux-pam/releases/download/v1.7.3/Linux-PAM-1.7.3.tar.xz"
filename = "Linux-PAM-1.7.3.tar.xz"
sha256 = "2ce4765fd49df6693771ef2941f81e33d8ee14b94a81a5c7b369aa3b137b85a5"

[dependencies]
native = []
target = ["glibc", "libxcrypt"]
runtime = ["glibc", "libxcrypt"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
