schema = 1

[package]
name = "npth"
version = "1.8"
revision = 1
arch = "x86_64"
description = "GnuPG native POSIX thread adapter"
license = "LGPL-2.1-or-later"

[[sources]]
name = "main"
url = "https://www.gnupg.org/ftp/gcrypt/npth/npth-1.8.tar.bz2"
filename = "npth-1.8.tar.bz2"
sha256 = "8bd24b4f23a3065d6e5b26e98aba9ce783ea4fd781069c1b35d149694e90ca3e"

[dependencies]
native = []
target = ["glibc"]
runtime = ["glibc"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
