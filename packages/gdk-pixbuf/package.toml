schema = 1

[package]
name = "gdk-pixbuf"
version = "2.44.8"
revision = 1
arch = "x86_64"
description = "PNG image loader for sandboxed portal validation"
license = "LGPL-2.1-or-later"

[[sources]]
name = "main"
url = "https://download.gnome.org/sources/gdk-pixbuf/2.44/gdk-pixbuf-2.44.8.tar.xz"
filename = "gdk-pixbuf-2.44.8.tar.xz"
sha256 = "919f529512961a12e81cd4b4b466a48c3933469e7f9a310c6513cd4fb252ba3c"

[dependencies]
native = []
target = ["glib", "libpng", "shared-mime-info", "gettext"]
runtime = ["glib", "libpng", "shared-mime-info"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
