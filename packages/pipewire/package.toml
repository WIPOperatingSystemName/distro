schema = 1

[package]
name = "pipewire"
version = "1.6.9"
revision = 2
arch = "x86_64"
description = "PipeWire multimedia graph and SPA plugins for the Telorgon session"
license = "MIT"
url = "https://pipewire.org/"

[[sources]]
name = "main"
url = "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.6.9/pipewire-1.6.9.tar.bz2"
filename = "pipewire-1.6.9.tar.bz2"
sha256 = "0cde58c124825bad462b32ab79f9aa286ee7b113cc73a5cda923a4365e752657"

[dependencies]
native = []
target = ["glibc", "dbus", "libudev", "alsa-lib"]
runtime = ["glibc", "dbus", "libudev", "alsa-lib"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
