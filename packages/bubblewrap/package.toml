schema = 1

[package]
name = "bubblewrap"
version = "0.11.2"
revision = 1
arch = "x86_64"
description = "Unprivileged namespace sandbox for portal validators"
license = "LGPL-2.0-or-later"

[[sources]]
name = "main"
url = "https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz"
filename = "bubblewrap-0.11.2.tar.xz"
sha256 = "69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6"

[dependencies]
native = []
target = ["glibc", "libcap"]
