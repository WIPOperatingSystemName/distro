schema = 1

[package]
name = "curl"
version = "8.22.0"
revision = 2
arch = "x86_64"
description = "HTTP and HTTPS downloads with target OpenSSL and CA verification"
license = "curl"

[[sources]]
name = "main"
url = "https://curl.se/download/curl-8.22.0.tar.xz"
filename = "curl-8.22.0.tar.xz"
sha256 = "f7ef3ae8a22e521f289803fe93543eb64c329b58aa73a9e224dfd915a2a5f4f7"

[dependencies]
native = []
target = ["glibc", "openssl", "zlib", "ca-certificates"]
runtime = ["glibc", "openssl", "zlib", "ca-certificates"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
