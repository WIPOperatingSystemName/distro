schema = 1

[package]
name = "fuse3"
version = "3.18.3"
revision = 2
arch = "x86_64"
description = "FUSE userspace filesystem library and helpers"
license = "LGPL-2.1-or-later"

[[sources]]
name = "main"
url = "https://github.com/libfuse/libfuse/releases/download/fuse-3.18.3/fuse-3.18.3.tar.gz"
filename = "fuse-3.18.3.tar.gz"
sha256 = "bcd19582c5e30f7fe45dd86a5540e998590aa01903afc7ebcbeea6c8ac5421ee"

[dependencies]
native = []
target = ["glibc", "libudev"]
runtime = ["glibc", "libudev"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
