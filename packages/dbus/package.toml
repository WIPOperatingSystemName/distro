schema = 1

[package]
name = "dbus"
version = "1.16.2"
revision = 2
arch = "x86_64"
description = "D-Bus message daemon, client tools and IPC library"
license = "AFL-2.1 OR GPL-2.0-or-later"
url = "https://dbus.freedesktop.org/"

[[sources]]
name = "main"
url = "https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz"
filename = "dbus-1.16.2.tar.xz"
sha256 = "0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2"

[dependencies]
native = []
target = ["glibc", "expat", "libsystemd"]
runtime = ["glibc", "expat", "libsystemd"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
