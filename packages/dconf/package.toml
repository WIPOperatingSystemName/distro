schema = 1

[package]
name = "dconf"
version = "51.0"
revision = 1
arch = "x86_64"
description = "GNOME settings database compiler, GSettings backend and user service"
license = "LGPL-2.1-or-later"

[[sources]]
name = "main"
url = "https://download.gnome.org/sources/dconf/51/dconf-51.0.tar.xz"
filename = "dconf-51.0.tar.xz"
sha256 = "e65c1b7867f836faad9f9ee04acf5c5a6cae2bbc784833fe093207e0cb590248"

[dependencies]
native = []
target = ["glib", "dbus"]
runtime = ["glib", "dbus"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
