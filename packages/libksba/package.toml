schema = 1

[package]
name = "libksba"
version = "1.8.1"
revision = 1
arch = "x86_64"
description = "X.509 and CMS cryptographic structures"
license = "LGPL-3.0-or-later AND GPL-2.0-or-later"

[[sources]]
name = "main"
url = "https://www.gnupg.org/ftp/gcrypt/libksba/libksba-1.8.1.tar.bz2"
filename = "libksba-1.8.1.tar.bz2"
sha256 = "c2f84393011827219ae117131dba8e7684c2bed0961eed11b0642c2acba440b5"

[dependencies]
native = []
target = ["glibc", "libgpg-error"]
runtime = ["glibc", "libgpg-error"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
