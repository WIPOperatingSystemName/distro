schema = 1

[package]
name = "libassuan"
version = "3.0.2"
revision = 1
arch = "x86_64"
description = "GnuPG Assuan IPC library"
license = "LGPL-2.1-or-later"

[[sources]]
name = "main"
url = "https://www.gnupg.org/ftp/gcrypt/libassuan/libassuan-3.0.2.tar.bz2"
filename = "libassuan-3.0.2.tar.bz2"
sha256 = "d2931cdad266e633510f9970e1a2f346055e351bb19f9b78912475b8074c36f6"

[dependencies]
native = []
target = ["glibc", "libgpg-error"]
runtime = ["glibc", "libgpg-error"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
