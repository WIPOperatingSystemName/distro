schema = 1

[package]
name = "pacman"
version = "7.1.0"
revision = 2
arch = "x86_64"
description = "OpenPGP-authenticated package manager and libalpm with HTTPS transport"
license = "GPL-2.0-or-later"
url = "https://pacman.archlinux.page/"
backup = ["etc/pacman.conf"]

[[sources]]
name = "main"
url = "https://gitlab.archlinux.org/pacman/pacman/-/releases/v7.1.0/downloads/pacman-7.1.0.tar.xz"
filename = "pacman-7.1.0.tar.xz"
sha256 = "530e50d7edbb2a22581c6d6707d2113240276c1bec4ee39a99488e1243c32171"

[dependencies]
native = []
target = ["glibc", "libarchive", "openssl", "busybox", "curl", "gpgme"]
runtime = ["glibc", "libarchive", "openssl", "busybox", "curl", "gpgme"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]

[build.environment]
CD_PACMAN_PROFILE = "secure"
