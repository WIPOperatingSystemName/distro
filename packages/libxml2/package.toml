schema = 1

[package]
name = "libxml2"
version = "2.15.4"
revision = 2
arch = "x86_64"
description = "XML parser and real XML validation tools"
license = "MIT"
url = "https://download.gnome.org/sources/libxml2/2.15"

[[sources]]
name = "main"
url = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz"
filename = "libxml2-2.15.4.tar.xz"
sha256 = "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821"

[dependencies]
native = []
target = ["glibc"]
runtime = ["glibc", "busybox"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
