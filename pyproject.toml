[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-distro-build"
version = "0.1.0"
description = "Python-coordinated source builds for Custom Distro"
requires-python = ">=3.11"

[project.scripts]
custom-distro = "distro_build.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"distro_build.packaging" = ["*.c", "*.toml"]
